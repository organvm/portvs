name: Portvs Browser Proof

on:
  pull_request:
    paths:
      - ".github/workflows/portvs-browser-proof.yml"
      - "incubator/triptych-video-canon/**"

permissions:
  contents: read

concurrency:
  group: portvs-browser-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  served-http-continuity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: incubator/triptych-video-canon/requirements-runtime-proof.txt

      - name: Install proof dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r incubator/triptych-video-canon/requirements-runtime-proof.txt
          command -v ffmpeg
          command -v ffprobe

      - name: Run exact-head served HTTP continuity proof
        working-directory: incubator/triptych-video-canon
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || \
            command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          PORTVS_BROWSER_EXECUTABLE="$browser" \
            python run_review_proof.py \
              --transport http \
              --output "runtime-proof/ci-${GITHUB_SHA}" \
              --timeout 120

      - name: Retain bounded proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portvs-browser-proof-${{ github.sha }}
          path: |
            incubator/triptych-video-canon/runtime-proof/ci-${{ github.sha }}/*.json
            incubator/triptych-video-canon/runtime-proof/ci-${{ github.sha }}/*.log
          if-no-files-found: error
          retention-days: 7
